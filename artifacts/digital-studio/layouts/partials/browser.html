<div class="browser-mockup {{ with .class }}{{ . }}{{ end }}">
  <div class="browser-bar"><span></span><span></span><span></span><small>{{ .label }}</small></div>
  <div class="browser-canvas {{ .theme }}">
    <div class="mock-brand">northline<span>.</span></div>
    <div class="mock-nav">work &nbsp;&nbsp; services &nbsp;&nbsp; contact</div>
    <div class="mock-display">{{ .headline | safeHTML }}</div>
    <div class="mock-rule"></div>
    <div class="mock-blocks"><i></i><i></i><i></i></div>
    <div class="mock-cursor">↗</div>
  </div>
</div>
