<footer class="site-footer">
  <div class="shell footer-top">
    <div class="footer-prompt">
      <p class="eyebrow">Have a good problem?</p>
      <h2>Let’s make it<br><em>useful.</em></h2>
      <a class="arrow-link light" href="{{ "/contact/" | relURL }}">Tell me what’s happening <span aria-hidden="true">↗</span></a>
    </div>
    <div class="footer-meta">
      <p>Workshop Digital is an independent digital studio for small businesses with big plans.</p>
      <a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a>
      <span>{{ .Site.Params.location }}</span>
    </div>
  </div>
  <div class="shell footer-bottom">
    <span>© {{ now.Year }} Workshop Digital</span>
    <span>Built with care, not committee.</span>
    <a href="{{ "/sitemap.xml" | relURL }}">Sitemap</a>
  </div>
</footer>
