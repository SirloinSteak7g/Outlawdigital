- step: "01"
  title: "Understand"
  copy: "We listen for the real problem behind the brief, then make it specific."
- step: "02"
  title: "Design"
  copy: "We give the idea a shape, a voice and a route people can actually follow."
- step: "03"
  title: "Build"
  copy: "We make the useful thing: fast, accessible and ready for the day-to-day."
- step: "04"
  title: "Launch"
  copy: "We put it in the world carefully, with the handover and tools to use it."
- step: "05"
  title: "Improve"
  copy: "We watch what happens next and keep making the system earn its keep."